<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">

    <title>Unit to rem convertor</title>
</head>

<body>
    <main>
        <div >
            <h1>Units to rem convertor</h1>
            <p>Auto paste on key up</p>
            <p>Separate units by space only</p>
        </div>
        <textarea rows="1" aria-label="Units: " onkeyup="convert(event)" id="input"></textarea>
        <p aria-label="Converted: " id="conversion"></p>
    </main>

    <script src="index.js"></script>
</body>

</html>
