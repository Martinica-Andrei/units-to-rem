<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">

    <title>Unit to rem convertor</title>
</head>

<body>
    <main>
        <div >
            <h1>Units to rem/em convertor</h1>
            <p>Auto paste on key up</p>
        </div>
        <select aria-label="Unit: " id="unit-selector" onchange="convert()">
            <option value="rem" selected>rem</option>
            <option value="em" selected>em</option>
        </select>
        <textarea rows="4" aria-label="Units: " onkeyup="convert()" id="input"></textarea>
        <pre aria-label="Converted: " id="display-conversion"></pre>
    </main>

    <script src="index.js"></script>
</body>

</html>
